name: Release

# Every push to main builds a Windows release with the next version, worked out from
# Conventional Commits (scripts/next-version.mjs). Add "[skip release]" to a commit message to
# leave it out. Pushes that only touch docs, site, design or CI finish early without a release.
on:
  # Runs after every push to main. scripts/next-version.mjs decides whether the push changed the
  # app; if not (docs, site, design or CI only), the run finishes in seconds with "Nothing to release".
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }

      - name: Work out the version
        id: ver
        run: node scripts/next-version.mjs --bump "${{ inputs.bump || 'auto' }}" --notes notes.md >> "$GITHUB_OUTPUT"

      - name: Nothing to release
        if: steps.ver.outputs.skip == 'true'
        run: echo "No app changes since the last tag; skipping."

      - uses: actions/setup-node@v5
        if: steps.ver.outputs.skip != 'true'
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        if: steps.ver.outputs.skip != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.ver.outputs.skip != 'true'
        with: { workspaces: "src-tauri -> target" }

      - name: Stamp ${{ steps.ver.outputs.version }}
        if: steps.ver.outputs.skip != 'true'
        run: node scripts/set-version.mjs "${{ steps.ver.outputs.version }}"

      - name: Test
        if: steps.ver.outputs.skip != 'true'
        run: |
          npm ci
          npm run check
          npm test
          npm run build
          (cd src-tauri && cargo test --release)

      - name: Build installer
        if: steps.ver.outputs.skip != 'true'
        env:
          # Signs the update bundle for the in-app updater (plan 20.3). Without the secret the
          # release still builds, just without latest.json, and the app falls back to a download link.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            npm run tauri -- build --bundles nsis
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without signed updates."
            npm run tauri -- build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*_x64-setup.exe out/
          cp src-tauri/target/release/bundle/nsis/*_x64-setup.exe.sig out/ 2>/dev/null || true

      - name: Updater manifest (latest.json)
        if: steps.ver.outputs.skip != 'true'
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          SIG="out/Postplant_${V}_x64-setup.exe.sig"
          if [ ! -f "$SIG" ]; then echo "No signature, no latest.json."; exit 0; fi
          node -e '
            const fs = require("fs");
            const [v, sig, notes] = process.argv.slice(1);
            fs.writeFileSync("out/latest.json", JSON.stringify({
              version: v,
              notes: fs.readFileSync(notes, "utf8"),
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": {
                signature: fs.readFileSync(sig, "utf8").trim(),
                url: `https://github.com/jeelnadaa/postplant/releases/download/v${v}/Postplant_${v}_x64-setup.exe`,
              } },
            }, null, 2));
          ' "$V" "$SIG" notes.md
          cat out/latest.json

      - name: Build offline installer (WebView2 bundled)
        if: steps.ver.outputs.skip != 'true'
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          npm run tauri -- build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false,"windows":{"webviewInstallMode":{"type":"offlineInstaller"}}}}'
          cp "src-tauri/target/release/bundle/nsis/Postplant_${V}_x64-setup.exe" "out/Postplant_${V}_x64-offline-setup.exe"

      - name: Package portable zip and checksums
        if: steps.ver.outputs.skip != 'true'
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          mkdir -p portable
          cp src-tauri/target/release/postplant.exe portable/Postplant.exe
          echo "Delete this file to make Postplant store its data in %APPDATA% instead of next to the exe." > portable/portable.flag
          (cd portable && 7z a -tzip "../out/Postplant_${V}_x64-portable.zip" Postplant.exe portable.flag > /dev/null)
          (cd out && sha256sum *.exe *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish GitHub release
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            git tag -a "$TAG" -m "Postplant ${{ steps.ver.outputs.version }}" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          gh release create "$TAG" out/* --verify-tag --title "Postplant ${{ steps.ver.outputs.version }}" --notes-file notes.md
